name: Publish v0.3.0 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "v0.3.0 already exists"
          else
            gh release create v0.3.0 --target "$GITHUB_SHA" --title "MCP Toolkit v0.3.0" --notes "MCP Toolkit v0.3.0 adds JSON Pointer lookup and URL component encoding/decoding, bringing the project to 9 MCP tools and 34 automated tests. See CHANGELOG.md for details."
          fi
