name: Bug report
description: Report a reproducible problem with MCP Toolkit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run npm test\n2. Call a tool with ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs (remove secrets)
      render: shell
